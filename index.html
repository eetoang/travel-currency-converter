  .guide-backdrop{z-index:8}.guide-modal{padding:22px}.guide-top{display:flex;align-items:center;justify-content:space-between;color:#807694;font-size:12px;font-weight:700}.guide-progress{display:flex;align-items:center;gap:6px;margin:20px 0 12px}.guide-progress span{height:5px;flex:1;border-radius:9px;background:#eee9f3}.guide-progress span.current,.guide-progress span.done{background:#714df3}.guide-progress small{margin-left:5px;color:#89819b;font-size:10px}.guide-illustration{height:74px;width:74px;margin:8px auto 12px;border-radius:25px;background:linear-gradient(140deg,#fff0a8,#ffe2ef);display:grid;place-items:center;font-size:35px}.guide-modal>.eyebrow{text-align:center}.guide-modal h2{margin:5px 0;text-align:center;font-size:22px;color:#30264b}.guide-modal>p{text-align:center;margin:8px 0 15px;color:#706981;font-size:14px;line-height:1.7}.guide-tip{padding:12px 14px;border-radius:14px;background:#f5f0ff;color:#6248a3;text-align:center;font-size:12px}.guide-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px}.guide-actions>div{display:flex;gap:7px}.guide-actions button{font-size:12px;padding:10px 13px}
  </style>

<body><div id="app"></div>
<script>
const KEY='lvhui-v1',GUIDE_KEY='lvhui-guide-seen-v1';
const currencies=[['TWD','新台币','🇹🇼'],['JPY','日元','🇯🇵'],['THB','泰铢','🇹🇭'],['IDR','印尼盾','🇮🇩'],['KRW','韩元','🇰🇷'],['SGD','新加坡元','🇸🇬'],['USD','美元','🇺🇸'],['EUR','欧元','🇪🇺'],['CNY','人民币','🇨🇳'],['VND','越南盾','🇻🇳'],['AUD','澳元','🇦🇺'],['GBP','英镑','🇬🇧']];
const uid=()=>Math.random().toString(36).slice(2,10);
function fresh(){return {activeId:null,trips:[]}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.trips)){const count=s.trips.length;s.trips=s.trips.filter(t=>t.id!=='trip-demo').map(t=>({...t,records:Array.isArray(t.records)?t.records:[]}));if(s.activeId==='trip-demo')s.activeId=s.trips[0]?.id||null;if(s.trips.length!==count)localStorage.setItem(KEY,JSON.stringify(s));return s}}catch(e){}return fresh()}
let state=load(),page='home',input='',guideStep=0,modal=localStorage.getItem(GUIDE_KEY)?null:{type:'guide',firstTime:true},toastTimer;
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const active=()=>state.trips.find(t=>t.id===state.activeId)||state.trips[0];
const totals=t=>t.records.reduce((a,r)=>({myr:a.myr+Number(r.myr),foreign:a.foreign+Number(r.foreign)}),{myr:0,foreign:0});
const rate=t=>{let x=totals(t);return x.foreign?x.myr/x.foreign:null};
const fmt=(n,d=2)=>Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>'RM '+fmt(n);
const curr=c=>currencies.find(x=>x[0]===c)||[c,c,'💱'];
const dateFmt=s=>{if(!s)return '';let d=new Date(s+'T12:00:00');return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric',year:'numeric'})};
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){let n=document.querySelector('.toast');if(n)n.remove();n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2300)}
const nav=(activePage)=>`<button class="nav ${activePage==='home'?'active':''}" data-page="home"><span>⌂</span>换算器</button><button class="nav ${activePage==='records'?'active':''}" data-page="records"><span>⇄</span>兑换记录</button><button class="nav ${activePage==='trips'?'active':''}" data-page="trips"><span>⌖</span>旅行管理</button>`;
function shell(){let t=active();let c=t?curr(t.currency):null;return `<div class="shell"><header class="topbar"><div class="brand"><img class="brandmark" src="logo.svg" alt=""><div>旅汇<small>把每一次兑换，变成安心的价格</small></div></div><div class="top-actions"><button class="guide-button" data-action="guide-open" aria-label="使用教学" title="使用教学">？</button><button class="trip-pill" data-page="trips">${t?c[2]+' '+esc(t.name):'＋ 创建旅行'} <span>⌄</span></button></div></header><div class="layout"><aside class="sidebar">${nav(page)}<div class="side-note"><b>按真实兑换计算</b>记录每次兑换金额，自动算出加权平均汇率。数据只保存在这台设备。</div></aside><main class="content">${page==='home'?home():page==='records'?recordsPage():tripsPage()}</main></div><nav class="mobile-nav">${nav(page)}</nav></div>${modal?modalView():''}`}
function home(){let t=active();if(!t)return `<div class="welcome"><div><div class="eyebrow">TRAVEL MONEY</div><h1>把当地价格换算成马币</h1></div></div><div class="card empty"><div class="empty-icon">🧭</div><b>先创建一趟旅行</b><p>选择目的地货币，再添加你的实际兑换记录。</p><button class="primary" data-action="trip-new">创建旅行</button></div>`;let c=curr(t.currency),r=rate(t),sum=totals(t),result=Number(input||0)*(r||0),recent=[...t.records].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);return `<div class="welcome"><div><div class="eyebrow">TRAVEL MONEY · ${esc(t.currency)}</div><h1>这个要多少马币？</h1></div><div class="date-note">${esc(t.name)} · ${c[1]}</div></div><section class="hero-grid"><article class="card converter-card ${r?'':'no-rate'}"><div class="card-head"><div class="card-title">即时换算</div><span class="tag">${r?'你的实际汇率':'等待首笔兑换'}</span></div>${r?'':`<div class="first-exchange"><div class="empty-icon">⇄</div><b>先记录第一笔实际兑换</b><p>填写支付的马币和收到的 ${esc(t.currency)}，即可开始换算。</p><button class="primary" data-action="record-new">添加第一笔兑换</button></div>`}<label class="field-label" for="amount">当地价格 · ${esc(t.currency)}</label><div class="money-input"><span class="currency">${esc(t.currency)}</span><input id="amount" inputmode="decimal" autocomplete="off" placeholder="输入金额" value="${esc(input)}" aria-label="当地货币金额"></div><div class="swapline" aria-hidden="true"><span>⇅</span></div><div class="result-box"><div><small>约合马币</small><strong>${money(result)}</strong></div><span class="result-currency">MYR</span></div><div class="rate-foot"><span>1 ${esc(t.currency)} = <b>${money(r||0)}</b></span><span>按实际综合汇率计算</span></div><div class="clear-row"><button class="clear-button" data-action="clear" aria-label="清空金额">清空</button></div></article><article class="card stat-card"><div><div class="stat-top"><span>综合实际汇率</span><span class="stat-icon">↗</span></div><div class="rate-number">${r?fmt(1/r,4):'—'}</div><div class="rate-unit">${esc(t.currency)} / RM 1</div></div><div class="stat-bottom"><span>基于 ${t.records.length} 笔兑换</span><b>${r?money(r)+' / '+t.currency:'待添加'}</b></div></article></section><section class="below-grid"><article class="card section-card"><div class="section-header"><h2>最近兑换</h2><button class="text-button" data-page="records">全部记录 →</button></div>${recent.length?recent.map(recordRow).join(''):`<div class="empty"><div class="empty-icon">✦</div>还没有兑换记录<br>添加实际兑换，开始使用个人汇率</div>`}<div class="quick-actions"><button class="secondary" data-action="record-new">＋ 添加兑换</button><button class="text-button" data-page="trips">管理旅行</button></div></article><article class="card section-card"><div class="section-header"><h2>本次旅行概览</h2><button class="text-button" data-page="trips">旅行设置</button></div><div class="record-row"><div class="record-left"><div class="record-dot">↘</div><div class="record-meta"><b>累计马币支出</b><small>所有兑换记录合计</small></div></div><div class="record-amount">${money(sum.myr)}</div></div><div class="record-row"><div class="record-left"><div class="record-dot">↗</div><div class="record-meta"><b>累计外币收入</b><small>${esc(t.currency)} 总额</small></div></div><div class="record-amount">${fmt(sum.foreign,2)}<small>${esc(t.currency)}</small></div></div><div class="record-row"><div class="record-left"><div class="record-dot">◎</div><div class="record-meta"><b>计算方式</b><small>总马币支出 ÷ 外币总收入</small></div></div><div class="record-amount" style="color:var(--green)">加权平均</div></div></article></section>`}
function recordRow(r){let t=active();return `<div class="record-row"><div class="record-left"><div class="record-dot">↗</div><div class="record-meta"><b>${esc(r.note||'兑换外币')}</b><small>${dateFmt(r.date)}</small></div></div><div class="record-amount">+ ${fmt(r.foreign)} ${esc(t.currency)}<small>− ${money(r.myr)}</small></div></div>`}
function recordsPage(){let t=active();if(!t)return `<div class="page-head"><div><div class="eyebrow">EXCHANGE LOG</div><h1>兑换记录</h1></div></div><div class="card empty">创建旅行后即可记录兑换。<br><button class="primary" data-action="trip-new" style="margin-top:14px">创建旅行</button></div>`;let s=totals(t),r=rate(t),rows=[...t.records].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="page-head"><div><div class="eyebrow">EXCHANGE LOG · ${esc(t.currency)}</div><h1>兑换记录</h1></div><button class="primary" data-action="record-new">${rows.length?'＋ 新增兑换':'添加第一笔兑换'}</button></div><div class="summary-strip"><div class="card summary"><small>马币总支出</small><strong>${money(s.myr)}</strong></div><div class="card summary"><small>${esc(t.currency)} 总收入</small><strong>${fmt(s.foreign,2)}</strong></div><div class="card summary"><small>综合汇率 MYR / ${esc(t.currency)}</small><strong>${r?fmt(r,6):'—'}</strong></div></div><div class="card list-card">${rows.length?rows.map(x=>`<div class="record-management"><div class="record-main"><div class="record-dot">↗</div><div class="record-meta"><b>${esc(x.note||'兑换外币')}</b><small>${dateFmt(x.date)} · 支出 ${money(x.myr)}</small><small>收到 ${fmt(x.foreign,2)} ${esc(t.currency)}</small></div></div><div class="record-actions"><button class="mini-btn" title="编辑" data-action="record-edit" data-id="${x.id}">✎</button><button class="mini-btn" title="删除" data-action="record-delete" data-id="${x.id}">×</button></div></div>`).join(''):`<div class="empty"><div class="empty-icon">⇄</div><b>还没有兑换记录</b><p>添加你实际支付和收到的金额，自动计算综合汇率。</p><button class="primary" data-action="record-new">添加第一笔兑换</button></div>`}</div>`}
function tripsPage(){return `<div class="page-head"><div><div class="eyebrow">YOUR JOURNEYS</div><h1>旅行管理</h1></div><button class="primary" data-action="trip-new">＋ 新建旅行</button></div>${state.trips.length?`<div class="trip-list">${state.trips.map(t=>{let c=curr(t.currency),s=totals(t),is=t.id===state.activeId;return `<article class="card trip-card ${is?'selected':''}">${is?'<span class="selected-badge">当前旅行</span>':''}<div class="trip-flag">${c[2]}</div><h3>${esc(t.name)}</h3><p>${c[1]} · ${esc(t.currency)}</p><div class="trip-summary"><span>${t.records.length} 笔兑换</span><b>${money(s.myr)} 已兑换</b></div><div class="trip-actions"><button class="secondary" data-action="trip-select" data-id="${t.id}">${is?'使用中':'切换到此旅行'}</button><button class="mini-btn" data-action="trip-edit" data-id="${t.id}" title="编辑旅行">✎</button><button class="mini-btn" data-action="trip-delete" data-id="${t.id}" title="删除旅行">×</button></div></article>`}).join('')}</div>`:`<div class="card empty"><div class="empty-icon">🧭</div><b>创建你的第一趟旅行</b><p>每趟旅行使用一种外币，兑换记录会分别计算。</p><button class="primary" data-action="trip-new">新建旅行</button></div>`}<div class="card section-card" style="margin-top:17px;background:#edf2e9;box-shadow:none"><div class="section-header"><h2>汇率如何计算？</h2></div><div style="font-size:13px;color:#5d6c62">综合实际汇率 = 所有兑换的马币支出总和 ÷ 外币收入总和。每笔兑换金额都会参与加权，因此大额兑换对结果的影响更大。记录保存在此设备，可离线使用。</div></div>`}
function modalView(){if(!modal)return '';let m=modal;if(m.type==='guide'){let step=guideSteps[guideStep];return `<div class="modal-backdrop guide-backdrop" data-action="backdrop"><section class="modal guide-modal" role="dialog" aria-modal="true" aria-labelledby="guide-title"><div class="guide-top"><span>旅汇 · 使用教学</span><button class="close" data-action="guide-skip" aria-label="关闭教学">×</button></div><div class="guide-progress">${guideSteps.map((_,i)=>`<span class="${i===guideStep?'current':i<guideStep?'done':''}"></span>`).join('')}<small>${guideStep+1} / ${guideSteps.length}</small></div><div class="guide-illustration">${step.icon}</div><div class="eyebrow">${step.label}</div><h2 id="guide-title">${step.title}</h2><p>${step.body}</p><div class="guide-tip">${step.tip}</div><div class="guide-actions"><button class="text-button" data-action="guide-skip">跳过教学</button><div>${guideStep?'<button class="secondary" data-action="guide-prev">上一步</button>':''}<button class="primary" data-action="guide-next">${guideStep===guideSteps.length-1?(m.firstTime&&!active()?'开始创建旅行':'完成'):'下一步'}</button></div></div></section></div>`}if(m.type==='record'){let t=active(),old=m.id&&t.records.find(x=>x.id===m.id);return `<div class="modal-backdrop" data-action="backdrop"><section class="modal"><div class="modal-head"><h2>${m.firstEntry?'录入第一笔兑换':old?'编辑兑换':'新增兑换记录'}</h2><button class="close" data-action="modal-close">×</button></div><form id="record-form"><div class="form-grid"><div class="form-row"><label>兑换日期</label><input type="date" name="date" required value="${esc(old?.date||new Date().toISOString().slice(0,10))}"></div><div class="form-row"><label>兑换地点 / 备注（选填）</label><input name="note" maxlength="45" placeholder="例如：机场兑换店" value="${esc(old?.note||'')}"></div></div><div class="form-row"><label>支付马币（MYR）</label><input name="myr" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="例如 1,000.00" value="${old?.myr??''}"></div><div class="form-row"><label>收到外币（${esc(t.currency)}）</label><input name="foreign" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="例如 7,000.00" value="${old?.foreign??''}"></div><div class="form-error" id="form-error" hidden></div><div class="modal-actions"><button type="button" class="secondary" data-action="modal-close">取消</button><button class="primary" type="submit">${m.firstEntry?'保存并开始换算':'保存记录'}</button></div></form></section></div>`}
if(m.type==='trip'){let old=m.id&&state.trips.find(x=>x.id===m.id);return `<div class="modal-backdrop" data-action="backdrop"><section class="modal"><div class="modal-head"><h2>${old?'编辑旅行':'创建旅行'}</h2><button class="close" data-action="modal-close">×</button></div><form id="trip-form"><div class="form-row"><label>旅行名称</label><input name="name" required maxlength="40" placeholder="例如：台湾旅行 2026" value="${esc(old?.name||'')}"></div><div class="form-row"><label>目的地货币</label><select name="currency" required>${currencies.map(c=>`<option value="${c[0]}" ${(old?.currency||'TWD')===c[0]?'selected':''}>${c[2]}　${c[0]} · ${c[1]}</option>`).join('')}</select></div><div class="form-error" id="form-error" hidden></div><div class="modal-actions"><button type="button" class="secondary" data-action="modal-close">取消</button><button class="primary" type="submit">${old?'保存修改':'创建旅行'}</button></div></form></section></div>`}
return `<div class="modal-backdrop"><section class="modal"><div class="modal-head"><h2>${m.title}</h2><button class="close" data-action="modal-close">×</button></div><p class="confirm-copy">${m.copy}</p><div class="modal-actions"><button class="secondary" data-action="modal-close">取消</button><button class="danger" data-action="confirm-delete">确认删除</button></div></section></div>`}
const guideSteps=[{label:'STEP 01 · 旅行',icon:'🧭',title:'先创建一趟旅行',body:'填写旅行名称，并选择目的地货币。每趟旅行对应一种外币，兑换记录会分开计算。',tip:'例如：东京旅行 · JPY'},{label:'STEP 02 · 真实兑换',icon:'💱',title:'录入实际兑换金额',body:'填写你支付的马币，以及实际收到的外币。可以添加多笔，系统会按总支出 ÷ 总收入计算加权汇率。',tip:'创建旅行后，马上就能添加第一笔兑换。'},{label:'STEP 03 · 即时换算',icon:'✨',title:'看到价格就换算',body:'回到换算器，输入当地价格，页面会即时显示约合多少马币。',tip:'旅行和兑换数据只保存在这台设备，也可离线使用。'}];
function endGuide(startTrip=false){const firstTime=Boolean(modal?.firstTime);localStorage.setItem(GUIDE_KEY,'1');modal=startTrip&&firstTime&&!active()?{type:'trip'}:null;guideStep=0;render()}
function render(){document.querySelector('#app').innerHTML=shell();if(page==='home'){let a=document.querySelector('#amount');if(a)a.addEventListener('input',e=>{let p=e.target.selectionStart;input=e.target.value;let y=e.target.closest('.converter-card').querySelector('.result-box strong');let rr=rate(active());y.textContent=money(Number(input||0)*(rr||0))})}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-page]');if(!el)return;if(el.dataset.page){page=el.dataset.page;render();return}let a=el.dataset.action,id=el.dataset.id;if(a==='modal-close'){if(modal?.type==='guide')endGuide();else{modal=null;render()}}else if(a==='backdrop'&&e.target===el){if(modal?.type==='guide')endGuide();else{modal=null;render()}}else if(a==='guide-open'){guideStep=0;modal={type:'guide',firstTime:false};render()}else if(a==='guide-skip'){endGuide()}else if(a==='guide-prev'){guideStep=Math.max(0,guideStep-1);render()}else if(a==='guide-next'){if(guideStep<guideSteps.length-1){guideStep++;render()}else endGuide(true)}else if(a==='clear'){input='';render()}else if(a==='trip-new'){modal={type:'trip'};render()}else if(a==='record-new'){if(!active()){toast('请先创建旅行');page='trips';render();return}modal={type:'record'};render()}else if(a==='record-edit'){modal={type:'record',id};render()}else if(a==='record-delete'){let x=active().records.find(r=>r.id===id);modal={type:'confirm',kind:'record',id,title:'删除这笔兑换？',copy:`将删除「${esc(x.note||'兑换外币')}」记录，并重新计算综合汇率。此操作无法撤销。`};render()}else if(a==='trip-edit'){modal={type:'trip',id};render()}else if(a==='trip-select'){state.activeId=id;save();page='home';render();toast('已切换旅行')}else if(a==='trip-delete'){let x=state.trips.find(t=>t.id===id);modal={type:'confirm',kind:'trip',id,title:'删除这趟旅行？',copy:`「${esc(x.name)}」及其 ${x.records.length} 笔兑换记录都会被删除。此操作无法撤销。`};render()}else if(a==='confirm-delete'){let m=modal;if(m.kind==='record'){active().records=active().records.filter(r=>r.id!==m.id)}else{state.trips=state.trips.filter(t=>t.id!==m.id);if(state.activeId===m.id)state.activeId=state.trips[0]?.id||null}save();modal=null;render();toast('已删除')}});
document.addEventListener('submit',e=>{if(e.target.id==='record-form'){e.preventDefault();let f=new FormData(e.target),myr=Number(f.get('myr')),foreign=Number(f.get('foreign')),err=document.querySelector('#form-error');if(!Number.isFinite(myr)||myr<=0||!Number.isFinite(foreign)||foreign<=0){err.hidden=false;err.textContent='马币支出和外币收入都必须是大于 0 的有效金额。';return}if(!/^\d{4}-\d{2}-\d{2}$/.test(f.get('date'))){err.hidden=false;err.textContent='请选择有效的兑换日期。';return}let rec={id:modal.id||uid(),date:f.get('date'),note:f.get('note').trim(),myr,foreign},t=active();if(modal.id)t.records=t.records.map(r=>r.id===modal.id?rec:r);else t.records.push(rec);let isFirstEntry=Boolean(modal.firstEntry);save();modal=null;render();toast(isFirstEntry?'首笔兑换已保存，可以开始换算':'兑换记录已保存')}if(e.target.id==='trip-form'){e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),currency=f.get('currency'),isEdit=Boolean(modal.id);if(!name){let er=document.querySelector('#form-error');er.hidden=false;er.textContent='请填写旅行名称。';return}if(isEdit){let t=state.trips.find(t=>t.id===modal.id);t.name=name;t.currency=currency}else{let t={id:uid(),name,currency,created:new Date().toISOString().slice(0,10),records:[]};state.trips.push(t);state.activeId=t.id}save();page='home';if(isEdit){modal=null;render();toast('已更新旅行')}else{modal={type:'record',firstEntry:true};render();toast('旅行已创建，请录入首笔兑换')}}});
// Correct creation toast after the modal closes.
if('serviceWorker'in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script></body></html>
