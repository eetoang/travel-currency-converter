  <style>
  :root{--ink:#202824;--muted:#7c857d;--line:#e8e9e2;--paper:#f5f4ef;--white:#fff;--green:#216e55;--mint:#e7f2eb;--lime:#d7ed87;--orange:#ed9b60;--shadow:0 18px 50px #25342d12;--radius:22px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 'DM Sans','Noto Sans SC',sans-serif}button,input,select{font:inherit}button{cursor:pointer}#app{min-height:100vh}.shell{max-width:1180px;margin:auto;padding:30px 30px 50px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:800;letter-spacing:-.6px}.brandmark{height:39px;width:39px;background:var(--green);color:white;border-radius:13px;display:grid;place-items:center;font-size:19px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.3px;margin-top:-3px}.top-actions{display:flex;gap:9px;align-items:center}.trip-pill,.icon-btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;color:var(--ink)}.trip-pill{display:flex;align-items:center;gap:8px;font-weight:600}.icon-btn{width:43px;height:43px;padding:0;font-size:18px}.layout{display:grid;grid-template-columns:215px minmax(0,1fr);gap:32px}.sidebar{padding:9px 0;display:flex;flex-direction:column;gap:6px}.nav{border:0;background:transparent;color:#718078;text-align:left;border-radius:13px;padding:12px 14px;font-weight:600;display:flex;gap:12px;align-items:center}.nav span{font-size:18px;width:22px;text-align:center}.nav.active{color:var(--green);background:var(--mint)}.side-note{margin-top:auto;border-radius:19px;background:#e8ede4;padding:17px;color:#53645a;font-size:12px}.side-note b{display:block;color:var(--ink);font-size:13px;margin-bottom:5px}.content{min-width:0}.welcome{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--green);font-weight:700}.welcome h1{font-size:29px;line-height:1.2;margin:6px 0 0;letter-spacing:-1px}.date-note{font-size:13px;color:var(--muted)}.hero-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:17px}.card{background:var(--white);border:1px solid #eceee8;border-radius:var(--radius);box-shadow:var(--shadow)}.converter-card{padding:25px;position:relative;overflow:hidden}.converter-card:after{content:'';position:absolute;width:200px;height:200px;right:-85px;top:-110px;border-radius:50%;background:#f0f6df}.card-head{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.card-title{font-size:14px;font-weight:700}.tag{border-radius:99px;background:#eff5e5;color:#617842;padding:6px 10px;font-size:11px;font-weight:700}.field-label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:21px 0 8px}.money-input{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:17px;padding:12px 16px;background:#fbfcf9}.money-input .currency{font-size:13px;font-weight:700;color:#52635a;background:#eef1ea;padding:8px 10px;border-radius:10px}.money-input input{width:100%;border:0;outline:0;background:transparent;font-size:30px;font-weight:700;letter-spacing:-1px;color:var(--ink);min-width:0}.money-input input::placeholder{color:#c4cbc2}.swapline{height:17px;border-left:1px dashed #c5d1c7;margin:0 0 0 30px;position:relative}.swapline:after{content:'↓';position:absolute;left:-10px;bottom:-7px;background:white;border:1px solid var(--line);color:var(--green);width:20px;height:20px;border-radius:50%;font-size:12px;text-align:center;line-height:18px}.result-box{background:var(--green);color:white;border-radius:17px;padding:15px 17px;display:flex;justify-content:space-between;align-items:center}.result-box small{color:#c9ded4;display:block;font-size:11px}.result-box strong{font-size:28px;letter-spacing:-.8px}.result-box .result-currency{font-size:12px;color:#d9e9df}.rate-foot{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;margin-top:14px}.rate-foot b{color:#53635a;font-weight:600}.stat-card{padding:22px;display:flex;flex-direction:column;justify-content:space-between;background:#e4f0e6;border-color:#e4f0e6;box-shadow:none}.stat-top{display:flex;align-items:center;justify-content:space-between;color:#52675b;font-size:12px;font-weight:600}.stat-icon{width:34px;height:34px;border-radius:12px;background:#fff9;color:var(--green);display:grid;place-items:center;font-size:17px}.rate-number{font-size:35px;font-weight:700;letter-spacing:-1.7px;margin:16px 0 2px;color:#1f4f3e}.rate-unit{color:#63806f;font-size:12px}.stat-bottom{border-top:1px solid #cedfd0;margin-top:18px;padding-top:14px;display:flex;justify-content:space-between;font-size:11px;color:#63806f}.stat-bottom b{color:#30483b}.below-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:17px}.section-card{padding:21px}.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.section-header h2{font-size:15px;margin:0}.text-button{border:0;background:transparent;color:var(--green);font-size:12px;font-weight:700;padding:5px}.record-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid #f0f1ed}.record-left{display:flex;align-items:center;gap:11px}.record-dot{height:37px;width:37px;border-radius:13px;background:#f2f4ed;color:var(--green);display:grid;place-items:center;font-size:16px}.record-meta b{display:block;font-size:13px}.record-meta small{color:var(--muted);font-size:11px}.record-amount{text-align:right;font-weight:700;font-size:13px}.record-amount small{display:block;color:var(--muted);font-size:10px;font-weight:500}.empty{padding:25px 10px;text-align:center;color:var(--muted);font-size:13px}.empty-icon{font-size:25px;margin-bottom:7px}.quick-actions{display:flex;gap:10px;margin-top:17px}.primary,.secondary,.danger{border:0;border-radius:13px;padding:12px 16px;font-weight:700}.primary{background:var(--green);color:white}.primary:hover{background:#195b45}.secondary{background:var(--mint);color:var(--green)}.danger{background:#fff0ed;color:#bb5447}.full{width:100%}.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}.page-head h1{margin:5px 0 0;font-size:28px;letter-spacing:-.8px}.summary-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.summary{padding:17px 19px}.summary small{color:var(--muted);font-size:11px}.summary strong{display:block;font-size:20px;margin-top:5px}.list-card{padding:8px 22px}.record-management{padding:16px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.record-management:last-child{border:0}.record-main{display:flex;align-items:center;gap:13px}.record-actions{display:flex;gap:6px}.mini-btn{border:1px solid var(--line);background:#fff;border-radius:10px;width:35px;height:35px;color:#6d7971}.trip-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.trip-card{padding:20px;position:relative}.trip-card.selected{border:1.5px solid #7ba88e}.trip-flag{width:43px;height:43px;border-radius:14px;background:#edf4e9;display:grid;place-items:center;font-size:20px;margin-bottom:14px}.trip-card h3{margin:0 0 4px;font-size:16px}.trip-card p{margin:0;color:var(--muted);font-size:12px}.trip-card .trip-summary{border-top:1px solid var(--line);margin-top:17px;padding-top:13px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.selected-badge{position:absolute;right:16px;top:17px;background:var(--mint);color:var(--green);padding:5px 9px;border-radius:99px;font-size:10px;font-weight:700}.trip-actions{display:flex;gap:8px;margin-top:15px}.trip-actions button{font-size:11px;padding:8px 10px}.modal-backdrop{position:fixed;inset:0;background:#18241fc0;display:grid;place-items:center;padding:18px;z-index:5}.modal{background:#fff;border-radius:22px;width:min(480px,100%);padding:24px;box-shadow:0 20px 80px #0003;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:19px;margin:0}.close{border:0;background:#f1f3ee;border-radius:10px;width:34px;height:34px}.form-row{margin-bottom:14px}.form-row label{display:block;font-size:12px;color:#69756d;font-weight:600;margin:0 0 7px}.form-row input,.form-row select{width:100%;border:1px solid var(--line);background:#fcfcfa;border-radius:12px;padding:12px;outline:none;color:var(--ink)}.form-row input:focus,.form-row select:focus{border-color:#78a38b;box-shadow:0 0 0 3px #e7f2eb}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-error{color:#b44c41;font-size:12px;margin:-4px 0 10px}.modal-actions{display:flex;gap:9px;margin-top:20px}.modal-actions>*{flex:1}.confirm-copy{color:#68746d;font-size:14px;line-height:1.65}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#21392e;color:white;border-radius:12px;padding:11px 17px;font-size:13px;box-shadow:var(--shadow);z-index:9}.mobile-nav{display:none}
  @media(max-width:800px){.shell{padding:22px 20px 35px}.layout{grid-template-columns:1fr;gap:0}.sidebar{display:none}.topbar{margin-bottom:25px}.hero-grid{grid-template-columns:1fr .8fr}.below-grid{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;z-index:3;bottom:0;left:0;right:0;background:#fffc;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;backdrop-filter:blur(14px)}.mobile-nav .nav{display:flex;flex-direction:column;gap:2px;text-align:center;padding:7px 14px;font-size:10px}.mobile-nav .nav span{font-size:18px}.shell{padding-bottom:110px}}
  @media(max-width:540px){.shell{padding:17px 15px 105px}.topbar{margin-bottom:22px}.brand{font-size:18px}.brandmark{height:36px;width:36px}.trip-pill{padding:9px 11px;font-size:12px}.icon-btn{height:39px;width:39px}.welcome{align-items:flex-start;flex-direction:column;gap:6px;margin-bottom:17px}.welcome h1,.page-head h1{font-size:25px}.date-note{font-size:11px}.hero-grid{grid-template-columns:1fr;gap:12px}.converter-card{padding:20px}.stat-card{padding:18px}.rate-number{font-size:30px;margin:10px 0 0}.stat-bottom{margin-top:14px;padding-top:11px}.below-grid{margin-top:12px;gap:12px}.section-card{padding:18px}.summary-strip{gap:8px}.summary{padding:13px 12px}.summary strong{font-size:16px}.summary small{font-size:10px}.list-card{padding:6px 15px}.record-management{align-items:flex-start}.record-actions{flex-shrink:0}.trip-list{grid-template-columns:1fr}.page-head{gap:10px;align-items:center}.page-head .primary{padding:10px 12px;font-size:12px}.form-grid{grid-template-columns:1fr 1fr}.rate-foot{font-size:10px}}
  /* Mobile home: keep one clear task in view, with generous breathing room. */
  .first-exchange{padding:24px 0 4px;text-align:center}
  .first-exchange .empty-icon{display:inline-grid;place-items:center;width:48px;height:48px;margin:0 auto 12px;border-radius:16px;background:#edf4e9;color:var(--green);font-size:23px}

  </style>

<body><div id="app"></div>
<script>
const KEY='lvhui-v1';
const currencies=[['TWD','新台币','🇹🇼'],['JPY','日元','🇯🇵'],['THB','泰铢','🇹🇭'],['IDR','印尼盾','🇮🇩'],['KRW','韩元','🇰🇷'],['SGD','新加坡元','🇸🇬'],['USD','美元','🇺🇸'],['EUR','欧元','🇪🇺'],['CNY','人民币','🇨🇳'],['VND','越南盾','🇻🇳'],['AUD','澳元','🇦🇺'],['GBP','英镑','🇬🇧']];
const uid=()=>Math.random().toString(36).slice(2,10);
function fresh(){return {activeId:'trip-demo',trips:[{id:'trip-demo',name:'台北慢旅行',currency:'TWD',created:new Date().toISOString().slice(0,10),records:[{id:uid(),date:'2026-10-11',myr:1000,foreign:7000,note:'市区兑换所'},{id:uid(),date:'2026-10-12',myr:500,foreign:3450,note:'机场兑换柜台'}]}]}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.trips))return s}catch(e){}return fresh()}
let state=load(),page='home',input='',modal=null,toastTimer;
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const active=()=>state.trips.find(t=>t.id===state.activeId)||state.trips[0];
const totals=t=>t.records.reduce((a,r)=>({myr:a.myr+Number(r.myr),foreign:a.foreign+Number(r.foreign)}),{myr:0,foreign:0});
const rate=t=>{let x=totals(t);return x.foreign?x.myr/x.foreign:null};
const fmt=(n,d=2)=>Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>'RM '+fmt(n);
const curr=c=>currencies.find(x=>x[0]===c)||[c,c,'💱'];
const dateFmt=s=>{if(!s)return '';let d=new Date(s+'T12:00:00');return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric',year:'numeric'})};
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){let n=document.querySelector('.toast');if(n)n.remove();n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2300)}
const nav=(activePage)=>`<button class="nav ${activePage==='home'?'active':''}" data-page="home"><span>⌂</span>换算器</button><button class="nav ${activePage==='records'?'active':''}" data-page="records"><span>⇄</span>兑换记录</button><button class="nav ${activePage==='trips'?'active':''}" data-page="trips"><span>⌖</span>旅行管理</button>`;
function shell(){let t=active();let c=t?curr(t.currency):null;return `<div class="shell"><header class="topbar"><div class="brand"><div class="brandmark">↗</div><div>旅汇<small>把每一次兑换，变成安心的价格</small></div></div><div class="top-actions"><button class="trip-pill" data-page="trips">${t?c[2]+' '+esc(t.name):'＋ 创建旅行'} <span>⌄</span></button><button class="icon-btn" title="清空金额" data-action="clear">↺</button></div></header><div class="layout"><aside class="sidebar">${nav(page)}<div class="side-note"><b>按真实兑换计算</b>记录每次兑换金额，自动算出加权平均汇率。数据只保存在这台设备。</div></aside><main class="content">${page==='home'?home():page==='records'?recordsPage():tripsPage()}</main></div><nav class="mobile-nav">${nav(page)}</nav></div>${modal?modalView():''}`}
function home(){let t=active();if(!t)return `<div class="welcome"><div><div class="eyebrow">TRAVEL MONEY</div><h1>把当地价格换算成马币</h1></div></div><div class="card empty"><div class="empty-icon">🧭</div><b>先创建一趟旅行</b><p>选择目的地货币，再添加你的实际兑换记录。</p><button class="primary" data-action="trip-new">创建旅行</button></div>`;let c=curr(t.currency),r=rate(t),sum=totals(t),result=Number(input||0)*(r||0),recent=[...t.records].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);return `<div class="welcome"><div><div class="eyebrow">TRAVEL MONEY · ${esc(t.currency)}</div><h1>现在看到的价格，是多少马币？</h1></div><div class="date-note">${esc(t.name)} · ${c[1]}</div></div><section class="hero-grid"><article class="card converter-card ${r?'':'no-rate'}"><div class="card-head"><div class="card-title">即时换算</div><span class="tag">${r?'你的实际汇率':'等待首笔兑换'}</span></div>${r?'':`<div class="first-exchange"><div class="empty-icon">⇄</div><b>先记录第一笔实际兑换</b><p>填写支付的马币和收到的 ${esc(t.currency)}，即可开始换算。</p><button class="primary" data-action="record-new">添加第一笔兑换</button></div>`}<label class="field-label" for="amount">当地价格 · ${esc(t.currency)}</label><div class="money-input"><span class="currency">${esc(t.currency)}</span><input id="amount" inputmode="decimal" autocomplete="off" placeholder="输入金额" value="${esc(input)}" aria-label="当地货币金额"></div><div class="swapline"></div><div class="result-box"><div><small>约合马币</small><strong>${money(result)}</strong></div><span class="result-currency">MYR</span></div><div class="rate-foot"><span>1 ${esc(t.currency)} = <b>${money(r||0)}</b></span><span>按实际综合汇率计算</span></div></article><article class="card stat-card"><div><div class="stat-top"><span>综合实际汇率</span><span class="stat-icon">↗</span></div><div class="rate-number">${r?fmt(1/r,4):'—'}</div><div class="rate-unit">${esc(t.currency)} / RM 1</div></div><div class="stat-bottom"><span>基于 ${t.records.length} 笔兑换</span><b>${r?money(r)+' / '+t.currency:'待添加'}</b></div></article></section><section class="below-grid"><article class="card section-card"><div class="section-header"><h2>最近兑换</h2><button class="text-button" data-page="records">全部记录 →</button></div>${recent.length?recent.map(recordRow).join(''):`<div class="empty"><div class="empty-icon">✦</div>还没有兑换记录<br>添加实际兑换，开始使用个人汇率</div>`}<div class="quick-actions"><button class="secondary" data-action="record-new">＋ 添加兑换</button><button class="text-button" data-page="trips">管理旅行</button></div></article><article class="card section-card"><div class="section-header"><h2>本次旅行概览</h2><button class="text-button" data-page="trips">旅行设置</button></div><div class="record-row"><div class="record-left"><div class="record-dot">↘</div><div class="record-meta"><b>累计马币支出</b><small>所有兑换记录合计</small></div></div><div class="record-amount">${money(sum.myr)}</div></div><div class="record-row"><div class="record-left"><div class="record-dot">↗</div><div class="record-meta"><b>累计外币收入</b><small>${esc(t.currency)} 总额</small></div></div><div class="record-amount">${fmt(sum.foreign,2)}<small>${esc(t.currency)}</small></div></div><div class="record-row"><div class="record-left"><div class="record-dot">◎</div><div class="record-meta"><b>计算方式</b><small>总马币支出 ÷ 外币总收入</small></div></div><div class="record-amount" style="color:var(--green)">加权平均</div></div></article></section>`}
function recordRow(r){let t=active();return `<div class="record-row"><div class="record-left"><div class="record-dot">↗</div><div class="record-meta"><b>${esc(r.note||'兑换外币')}</b><small>${dateFmt(r.date)}</small></div></div><div class="record-amount">+ ${fmt(r.foreign)} ${esc(t.currency)}<small>− ${money(r.myr)}</small></div></div>`}
function recordsPage(){let t=active();if(!t)return `<div class="page-head"><div><div class="eyebrow">EXCHANGE LOG</div><h1>兑换记录</h1></div></div><div class="card empty">创建旅行后即可记录兑换。<br><button class="primary" data-action="trip-new" style="margin-top:14px">创建旅行</button></div>`;let s=totals(t),r=rate(t),rows=[...t.records].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="page-head"><div><div class="eyebrow">EXCHANGE LOG · ${esc(t.currency)}</div><h1>兑换记录</h1></div><button class="primary" data-action="record-new">${rows.length?'＋ 新增兑换':'添加第一笔兑换'}</button></div><div class="summary-strip"><div class="card summary"><small>马币总支出</small><strong>${money(s.myr)}</strong></div><div class="card summary"><small>${esc(t.currency)} 总收入</small><strong>${fmt(s.foreign,2)}</strong></div><div class="card summary"><small>综合汇率 MYR / ${esc(t.currency)}</small><strong>${r?fmt(r,6):'—'}</strong></div></div><div class="card list-card">${rows.length?rows.map(x=>`<div class="record-management"><div class="record-main"><div class="record-dot">↗</div><div class="record-meta"><b>${esc(x.note||'兑换外币')}</b><small>${dateFmt(x.date)} · 支出 ${money(x.myr)}</small><small>收到 ${fmt(x.foreign,2)} ${esc(t.currency)}</small></div></div><div class="record-actions"><button class="mini-btn" title="编辑" data-action="record-edit" data-id="${x.id}">✎</button><button class="mini-btn" title="删除" data-action="record-delete" data-id="${x.id}">×</button></div></div>`).join(''):`<div class="empty"><div class="empty-icon">⇄</div><b>还没有兑换记录</b><p>添加你实际支付和收到的金额，自动计算综合汇率。</p><button class="primary" data-action="record-new">添加第一笔兑换</button></div>`}</div>`}
function tripsPage(){return `<div class="page-head"><div><div class="eyebrow">YOUR JOURNEYS</div><h1>旅行管理</h1></div><button class="primary" data-action="trip-new">＋ 新建旅行</button></div>${state.trips.length?`<div class="trip-list">${state.trips.map(t=>{let c=curr(t.currency),s=totals(t),is=t.id===state.activeId;return `<article class="card trip-card ${is?'selected':''}">${is?'<span class="selected-badge">当前旅行</span>':''}<div class="trip-flag">${c[2]}</div><h3>${esc(t.name)}</h3><p>${c[1]} · ${esc(t.currency)}</p><div class="trip-summary"><span>${t.records.length} 笔兑换</span><b>${money(s.myr)} 已兑换</b></div><div class="trip-actions"><button class="secondary" data-action="trip-select" data-id="${t.id}">${is?'使用中':'切换到此旅行'}</button><button class="mini-btn" data-action="trip-edit" data-id="${t.id}" title="编辑旅行">✎</button><button class="mini-btn" data-action="trip-delete" data-id="${t.id}" title="删除旅行">×</button></div></article>`}).join('')}</div>`:`<div class="card empty"><div class="empty-icon">🧭</div><b>创建你的第一趟旅行</b><p>每趟旅行使用一种外币，兑换记录会分别计算。</p><button class="primary" data-action="trip-new">新建旅行</button></div>`}<div class="card section-card" style="margin-top:17px;background:#edf2e9;box-shadow:none"><div class="section-header"><h2>汇率如何计算？</h2></div><div style="font-size:13px;color:#5d6c62">综合实际汇率 = 所有兑换的马币支出总和 ÷ 外币收入总和。每笔兑换金额都会参与加权，因此大额兑换对结果的影响更大。记录保存在此设备，可离线使用。</div></div>`}
function modalView(){if(!modal)return '';let m=modal;if(m.type==='record'){let t=active(),old=m.id&&t.records.find(x=>x.id===m.id);return `<div class="modal-backdrop" data-action="backdrop"><section class="modal"><div class="modal-head"><h2>${m.firstEntry?'录入第一笔兑换':old?'编辑兑换':'新增兑换记录'}</h2><button class="close" data-action="modal-close">×</button></div><form id="record-form"><div class="form-grid"><div class="form-row"><label>兑换日期</label><input type="date" name="date" required value="${esc(old?.date||new Date().toISOString().slice(0,10))}"></div><div class="form-row"><label>兑换地点 / 备注（选填）</label><input name="note" maxlength="45" placeholder="例如：机场兑换店" value="${esc(old?.note||'')}"></div></div><div class="form-row"><label>支付马币（MYR）</label><input name="myr" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="例如 1,000.00" value="${old?.myr??''}"></div><div class="form-row"><label>收到外币（${esc(t.currency)}）</label><input name="foreign" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="例如 7,000.00" value="${old?.foreign??''}"></div><div class="form-error" id="form-error" hidden></div><div class="modal-actions"><button type="button" class="secondary" data-action="modal-close">取消</button><button class="primary" type="submit">${m.firstEntry?'保存并开始换算':'保存记录'}</button></div></form></section></div>`}
if(m.type==='trip'){let old=m.id&&state.trips.find(x=>x.id===m.id);return `<div class="modal-backdrop" data-action="backdrop"><section class="modal"><div class="modal-head"><h2>${old?'编辑旅行':'创建旅行'}</h2><button class="close" data-action="modal-close">×</button></div><form id="trip-form"><div class="form-row"><label>旅行名称</label><input name="name" required maxlength="40" placeholder="例如：台湾旅行 2026" value="${esc(old?.name||'')}"></div><div class="form-row"><label>目的地货币</label><select name="currency" required>${currencies.map(c=>`<option value="${c[0]}" ${(old?.currency||'TWD')===c[0]?'selected':''}>${c[2]}　${c[0]} · ${c[1]}</option>`).join('')}</select></div><div class="form-error" id="form-error" hidden></div><div class="modal-actions"><button type="button" class="secondary" data-action="modal-close">取消</button><button class="primary" type="submit">${old?'保存修改':'创建旅行'}</button></div></form></section></div>`}
return `<div class="modal-backdrop"><section class="modal"><div class="modal-head"><h2>${m.title}</h2><button class="close" data-action="modal-close">×</button></div><p class="confirm-copy">${m.copy}</p><div class="modal-actions"><button class="secondary" data-action="modal-close">取消</button><button class="danger" data-action="confirm-delete">确认删除</button></div></section></div>`}
function render(){document.querySelector('#app').innerHTML=shell();if(page==='home'){let a=document.querySelector('#amount');if(a)a.addEventListener('input',e=>{let p=e.target.selectionStart;input=e.target.value;let y=e.target.closest('.converter-card').querySelector('.result-box strong');let rr=rate(active());y.textContent=money(Number(input||0)*(rr||0))})}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-page]');if(!el)return;if(el.dataset.page){page=el.dataset.page;render();return}let a=el.dataset.action,id=el.dataset.id;if(a==='modal-close'){modal=null;render()}else if(a==='backdrop'&&e.target===el){modal=null;render()}else if(a==='clear'){input='';render()}else if(a==='trip-new'){modal={type:'trip'};render()}else if(a==='record-new'){if(!active()){toast('请先创建旅行');page='trips';render();return}modal={type:'record'};render()}else if(a==='record-edit'){modal={type:'record',id};render()}else if(a==='record-delete'){let x=active().records.find(r=>r.id===id);modal={type:'confirm',kind:'record',id,title:'删除这笔兑换？',copy:`将删除「${esc(x.note||'兑换外币')}」记录，并重新计算综合汇率。此操作无法撤销。`};render()}else if(a==='trip-edit'){modal={type:'trip',id};render()}else if(a==='trip-select'){state.activeId=id;save();page='home';render();toast('已切换旅行')}else if(a==='trip-delete'){let x=state.trips.find(t=>t.id===id);modal={type:'confirm',kind:'trip',id,title:'删除这趟旅行？',copy:`「${esc(x.name)}」及其 ${x.records.length} 笔兑换记录都会被删除。此操作无法撤销。`};render()}else if(a==='confirm-delete'){let m=modal;if(m.kind==='record'){active().records=active().records.filter(r=>r.id!==m.id)}else{state.trips=state.trips.filter(t=>t.id!==m.id);if(state.activeId===m.id)state.activeId=state.trips[0]?.id||null}save();modal=null;render();toast('已删除')}});
document.addEventListener('submit',e=>{if(e.target.id==='record-form'){e.preventDefault();let f=new FormData(e.target),myr=Number(f.get('myr')),foreign=Number(f.get('foreign')),err=document.querySelector('#form-error');if(!Number.isFinite(myr)||myr<=0||!Number.isFinite(foreign)||foreign<=0){err.hidden=false;err.textContent='马币支出和外币收入都必须是大于 0 的有效金额。';return}if(!/^\d{4}-\d{2}-\d{2}$/.test(f.get('date'))){err.hidden=false;err.textContent='请选择有效的兑换日期。';return}let rec={id:modal.id||uid(),date:f.get('date'),note:f.get('note').trim(),myr,foreign},t=active();if(modal.id)t.records=t.records.map(r=>r.id===modal.id?rec:r);else t.records.push(rec);let isFirstEntry=Boolean(modal.firstEntry);save();modal=null;render();toast(isFirstEntry?'首笔兑换已保存，可以开始换算':'兑换记录已保存')}if(e.target.id==='trip-form'){e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),currency=f.get('currency'),isEdit=Boolean(modal.id);if(!name){let er=document.querySelector('#form-error');er.hidden=false;er.textContent='请填写旅行名称。';return}if(isEdit){let t=state.trips.find(t=>t.id===modal.id);t.name=name;t.currency=currency}else{let t={id:uid(),name,currency,created:new Date().toISOString().slice(0,10),records:[]};state.trips.push(t);state.activeId=t.id}save();page='home';if(isEdit){modal=null;render();toast('已更新旅行')}else{modal={type:'record',firstEntry:true};render();toast('旅行已创建，请录入首笔兑换')}}});
// Correct creation toast after the modal closes.
if('serviceWorker'in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script></body></html>
