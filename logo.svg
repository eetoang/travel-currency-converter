  <ellipse cx="119" cy="157" rx="112" ry="19" fill="#050505"/>
  <!-- round traveler -->
  <path d="M34 151C30 119 35 75 63 45 86 20 120 13 149 22c27 8 46 28 56 57 8 22 9 49 5 72-31 12-140 15-176 0Z" fill="#050505"/>
